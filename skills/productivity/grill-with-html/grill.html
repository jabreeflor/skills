<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Grill Me</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    max-width: 760px;
    margin: 0 auto;
    padding: 24px 16px 96px;
    line-height: 1.5;
  }
  h1 { margin: 0 0 4px; }
  .muted { opacity: 0.65; font-size: 0.9em; }
  #dropQuestions {
    border: 2px dashed currentColor;
    border-radius: 10px;
    padding: 32px;
    text-align: center;
    opacity: 0.7;
    cursor: pointer;
    margin: 20px 0;
  }
  #dropQuestions.over { opacity: 1; background: rgba(127,127,127,0.12); }
  .card {
    border: 1px solid rgba(127,127,127,0.4);
    border-radius: 10px;
    padding: 16px;
    margin: 16px 0;
  }
  .question { font-weight: 600; margin-bottom: 6px; }
  .rec { font-size: 0.9em; opacity: 0.8; margin-bottom: 12px; }
  .options { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .options button {
    border: 1px solid rgba(127,127,127,0.5);
    background: transparent;
    color: inherit;
    border-radius: 999px;
    padding: 6px 14px;
    cursor: pointer;
    font: inherit;
  }
  .options button.selected { background: #2d7ff9; color: #fff; border-color: #2d7ff9; }
  textarea {
    width: 100%;
    box-sizing: border-box;
    min-height: 64px;
    font: inherit;
    padding: 8px;
    border-radius: 8px;
    border: 1px solid rgba(127,127,127,0.5);
    background: transparent;
    color: inherit;
    resize: vertical;
  }
  .files {
    margin-top: 10px;
    border: 1px dashed rgba(127,127,127,0.5);
    border-radius: 8px;
    padding: 10px;
    font-size: 0.9em;
  }
  .files.over { background: rgba(45,127,249,0.12); }
  .files .hint { opacity: 0.6; }
  .attachment { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .attachment img { max-height: 48px; border-radius: 4px; }
  .attachment button { margin-left: auto; cursor: pointer; }
  #export {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: #2d7ff9; color: #fff; border: none; border-radius: 999px;
    padding: 12px 28px; font: inherit; font-weight: 600; cursor: pointer;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25);
  }
  #export[disabled] { opacity: 0.4; cursor: not-allowed; }
</style>
</head>
<body>
  <h1>Grill Me</h1>
  <p class="muted">Drag <code>grill-questions.json</code> below. Answer each question, attach files or paste images, then export your responses.</p>

  <div id="dropQuestions">
    Drop <code>grill-questions.json</code> here — or click to browse
    <input id="filePick" type="file" accept="application/json,.json" hidden />
  </div>

  <h2 id="topic"></h2>
  <div id="questions"></div>

  <button id="export" disabled>Export responses</button>

<script>
let topic = "";
const state = []; // { id, question, choice, comment, files: [], recommendation, options }

const dropZone = document.getElementById("dropQuestions");
const filePick = document.getElementById("filePick");
const exportBtn = document.getElementById("export");

dropZone.addEventListener("click", () => filePick.click());
filePick.addEventListener("change", e => { if (e.target.files[0]) loadQuestions(e.target.files[0]); });

dropZone.addEventListener("dragover", e => { e.preventDefault(); dropZone.classList.add("over"); });
dropZone.addEventListener("dragleave", () => dropZone.classList.remove("over"));
dropZone.addEventListener("drop", e => {
  e.preventDefault();
  dropZone.classList.remove("over");
  if (e.dataTransfer.files[0]) loadQuestions(e.dataTransfer.files[0]);
});

function loadQuestions(file) {
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try { data = JSON.parse(reader.result); }
    catch { alert("That file isn't valid JSON."); return; }
    topic = data.topic || "";
    document.getElementById("topic").textContent = topic;
    state.length = 0;
    (data.questions || []).forEach(q => state.push({
      id: q.id, question: q.question, choice: "", comment: "", files: [],
      recommendation: q.recommendation || "", options: q.options || []
    }));
    render();
    exportBtn.disabled = state.length === 0;
  };
  reader.readAsText(file);
}

function render() {
  const container = document.getElementById("questions");
  container.replaceChildren();
  state.forEach((q, i) => {
    const card = document.createElement("div");
    card.className = "card";

    const question = document.createElement("div");
    question.className = "question";
    question.textContent = `${i + 1}. ${q.question}`;
    card.appendChild(question);

    if (q.recommendation) {
      const rec = document.createElement("div");
      rec.className = "rec";
      rec.textContent = "Recommended: " + q.recommendation;
      card.appendChild(rec);
    }

    const opts = document.createElement("div");
    opts.className = "options";
    q.options.forEach(opt => {
      const b = document.createElement("button");
      b.textContent = opt;
      b.onclick = () => {
        q.choice = (q.choice === opt) ? "" : opt;
        render();
      };
      if (q.choice === opt) b.classList.add("selected");
      opts.appendChild(b);
    });
    card.appendChild(opts);

    const ta = document.createElement("textarea");
    ta.placeholder = "Comments…";
    ta.value = q.comment;
    ta.oninput = () => { q.comment = ta.value; };
    card.appendChild(ta);

    const files = document.createElement("div");
    files.className = "files";
    const hint = document.createElement("div");
    hint.className = "hint";
    hint.textContent = "Drop or paste files / images here";
    files.appendChild(hint);
    q.files.forEach((f, fi) => files.appendChild(attachmentRow(q, fi)));

    files.addEventListener("dragover", e => { e.preventDefault(); files.classList.add("over"); });
    files.addEventListener("dragleave", () => files.classList.remove("over"));
    files.addEventListener("drop", e => {
      e.preventDefault();
      files.classList.remove("over");
      [...e.dataTransfer.files].forEach(file => addFile(q, file));
    });
    ta.addEventListener("paste", e => {
      [...e.clipboardData.items].forEach(item => {
        if (item.kind === "file") addFile(q, item.getAsFile());
      });
    });
    card.appendChild(files);

    container.appendChild(card);
  });
}

function attachmentRow(q, fi) {
  const f = q.files[fi];
  const row = document.createElement("div");
  row.className = "attachment";
  if (f.type && f.type.startsWith("image/")) {
    const img = document.createElement("img");
    img.src = f.dataUrl;
    row.appendChild(img);
  }
  const name = document.createElement("span");
  name.textContent = f.name + (f.type ? ` (${f.type})` : "");
  row.appendChild(name);
  const rm = document.createElement("button");
  rm.textContent = "Remove";
  rm.onclick = () => { q.files.splice(fi, 1); render(); };
  row.appendChild(rm);
  return row;
}

function addFile(q, file) {
  const reader = new FileReader();
  const isText = file.type.startsWith("text/") || /\.(md|txt|json|csv|ya?ml|js|ts|py|sql|sh|html?|css)$/i.test(file.name);
  reader.onload = () => {
    const entry = { name: file.name, type: file.type || "application/octet-stream" };
    if (isText) entry.text = reader.result;
    else entry.dataUrl = reader.result;
    q.files.push(entry);
    render();
  };
  if (isText) reader.readAsText(file);
  else reader.readAsDataURL(file);
}

exportBtn.onclick = () => {
  const out = {
    topic,
    responses: state.map(q => ({
      id: q.id,
      question: q.question,
      choice: q.choice,
      comment: q.comment,
      files: q.files
    }))
  };
  const blob = new Blob([JSON.stringify(out, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "grill-responses.json";
  a.click();
  URL.revokeObjectURL(a.href);
};
</script>
</body>
</html>
