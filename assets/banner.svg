<svg xmlns="http://www.w3.org/2000/svg" width="860" height="220" viewBox="0 0 860 220" role="img" aria-label="Grill Skills">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="0.55" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="860" height="220" rx="18" fill="url(#bg)"/>

  <!-- grill grate -->
  <g transform="translate(70,150)" stroke="#475569" stroke-width="4" stroke-linecap="round">
    <line x1="0" y1="0" x2="150" y2="0"/>
    <line x1="0" y1="14" x2="150" y2="14"/>
    <line x1="0" y1="28" x2="150" y2="28"/>
    <line x1="12" y1="-8" x2="12" y2="36"/>
    <line x1="138" y1="-8" x2="138" y2="36"/>
  </g>

  <!-- flames -->
  <g transform="translate(95,70)">
    <path d="M40 70 C12 50 30 24 22 0 C44 16 40 36 52 30 C56 14 70 12 64 -6 C92 18 86 64 60 78 C52 82 46 80 40 70 Z" fill="url(#flame)"/>
    <path d="M44 70 C30 56 40 40 36 24 C50 34 48 48 56 44 C58 34 66 34 64 22 C80 38 74 62 58 72 Z" fill="#fff7ed" opacity="0.65"/>
  </g>

  <!-- text -->
  <text x="270" y="92" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="url(#ink)">Grill Skills</text>
  <text x="272" y="128" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#cbd5e1">Stress-test your plans before you build them</text>
  <text x="272" y="166" font-family="'SFMono-Regular', Consolas, monospace" font-size="15" fill="#64748b">grill-me  •  grill-with-html  •  grill-with-docs</text>
</svg>
